<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SkyComic - read manga, manhwa and manhua online.">
<meta name="theme-color" content="#04161c">
<title>SkyComic - Read Manga &amp; Manhwa Online</title>
<style>
:root{--bg:#04161c;--c1:#0d9488;--c2:#0ea5e9;--c3:#1d4ed8;--gl:rgba(255,255,255,.07);--gl2:rgba(255,255,255,.11);--bd:rgba(150,255,240,.18);--hi:rgba(200,255,250,.22);--sh:rgba(0,0,0,.35);--bl:26px;--r:24px;--tx:#e6fffb;--ac:#2dd4bf;--ac2:#04201f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.7;z-index:0;pointer-events:none}
.b1{width:300px;height:300px;top:-70px;left:-90px;background:var(--c1)}
.b2{width:280px;height:280px;top:38%;right:-110px;background:var(--c2)}
.b3{width:320px;height:320px;bottom:-110px;left:8%;background:var(--c3)}
.g{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(var(--bl)) saturate(170%);-webkit-backdrop-filter:blur(var(--bl)) saturate(170%);box-shadow:inset 0 1px 0 var(--hi),0 8px 30px var(--sh);border-radius:var(--r)}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 120px}
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:4;display:flex;gap:10px;align-items:center;padding:10px 12px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.5px;cursor:pointer}.logo b{color:var(--ac)}
.lg{position:relative;flex:none;width:46px;height:46px;border-radius:50%;padding:3px;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.06));border:1px solid rgba(190,170,255,.45);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 12px rgba(120,80,255,.25),0 0 18px rgba(139,92,246,.55),0 6px 16px rgba(0,0,0,.4);overflow:hidden}
.lg img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;opacity:.95}
.lg::after{content:"";position:absolute;left:8%;top:4%;width:84%;height:42%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.search{flex:1;min-width:0;width:100%;padding:10px 14px;border-radius:99px;font-size:14px;color:var(--tx);background:var(--gl2);border:1px solid var(--bd);outline:none}
.search::placeholder{color:var(--tx);opacity:.55}
.hero{position:relative;height:330px;overflow:hidden;margin-bottom:18px;cursor:pointer}
.hero .cv{position:absolute;inset:0;border-radius:0}
.info{position:absolute;left:10px;right:10px;bottom:10px;padding:14px}
.hero h2{font-size:22px;letter-spacing:-.4px;margin-bottom:4px}
.hero p{font-size:12px;opacity:.8;margin-bottom:10px}
.btns{display:flex;gap:8px}
.btn{padding:10px 16px;border-radius:99px;font-size:13px;font-weight:700;background:var(--ac);color:var(--ac2);border:0;cursor:pointer;font-family:inherit}
.btn.s{background:var(--gl2);color:var(--tx);border:1px solid var(--bd)}
.btn.on{background:var(--gl2);color:var(--ac);border:1px solid var(--ac)}
.car{display:flex;gap:12px;overflow-x:auto;padding:0 6%;margin:0 -14px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.car .hero{flex:none;width:88%;margin-bottom:0;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 18px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--tx);opacity:.3;transition:all .3s}
.dots i.on{width:22px;background:var(--ac);opacity:1}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sec h3{font-size:18px;letter-spacing:-.3px}.sec span{font-size:12px;color:var(--ac);font-weight:700;cursor:pointer}
.row{display:flex;gap:11px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:130px;cursor:pointer}
.cv{background-size:cover;background-position:center;background-image:linear-gradient(165deg,hsl(var(--h) 75% 55%),hsl(calc(var(--h) + 55) 70% 22%));position:relative}
.cover{height:182px;border-radius:calc(var(--r) - 6px);overflow:hidden;display:flex;align-items:flex-end;padding:8px;font-weight:800;font-size:15px;line-height:1.05;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.cover.noimg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 50%)}
.cover span{position:relative;z-index:1}
.card .cover{align-items:flex-end;justify-content:flex-start;text-align:left;font-size:13px;line-height:1.2;padding:10px}
.card .cover span.tag{position:absolute}
.tag{position:absolute;top:7px;left:7px;z-index:2;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
.card p{font-size:12.5px;margin:6px 2px 0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{font-size:11px;opacity:.6;margin-left:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid .card{width:auto}.grid .cover{height:215px}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.li{display:flex;gap:12px;padding:10px;align-items:center;cursor:pointer}
.li .cover{width:62px;height:84px;flex:none;padding:0;font-size:0}
.li h4{font-size:14px}.li p{font-size:12px;opacity:.7;margin-top:3px}
.li .go{margin-left:auto;font-size:11px;font-weight:700;padding:8px 13px;border-radius:99px;background:var(--ac);color:var(--ac2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--bd);background:var(--gl);cursor:pointer;opacity:.75}
.chip.on{background:var(--ac);color:var(--ac2);opacity:1;border-color:transparent}
.empty{text-align:center;padding:40px 20px;opacity:.7;font-size:14px;line-height:1.6}
h1.page{font-size:24px;margin:0 2px 12px;letter-spacing:-.5px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:4px;padding:8px;border-radius:99px;width:min(360px,calc(100% - 28px))}
.nav div{flex:1;text-align:center;font-size:12px;font-weight:600;padding:10px 0;border-radius:99px;opacity:.7;cursor:pointer}
.nav div.a{background:var(--ac);color:var(--ac2);opacity:1}
.sheet-bg{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border-radius:var(--r) var(--r) 0 0;background:rgba(8,30,38,.82);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.dh{display:flex;gap:14px;margin-bottom:14px}
.dh .cover{width:112px;height:158px;flex:none}
.dh h2{font-size:20px;letter-spacing:-.4px;margin-bottom:6px}
.meta{font-size:12px;opacity:.7;margin-bottom:10px;line-height:1.5}
.desc{font-size:13.5px;line-height:1.55;opacity:.85;margin-bottom:14px}
.ch{cursor:pointer;display:flex;justify-content:space-between;padding:12px 14px;margin-bottom:8px;font-size:14px;font-weight:600;border-radius:16px;color:var(--tx);text-decoration:none;background:var(--gl2);border:1px solid var(--bd)}
.ch small{opacity:.55;font-weight:500}
.close{float:right;font-size:22px;line-height:1;opacity:.7;cursor:pointer;padding:0 4px}
#rd{position:fixed;inset:0;z-index:30;background:#000;display:none}
#rd.show{display:block}
.rscroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.rscroll img{display:block;width:100%;max-width:720px;margin:0 auto;min-height:220px}
.demo{max-width:720px;margin:0 auto;height:min(125vw,900px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;font-weight:800;background:linear-gradient(165deg,hsl(var(--h) 60% 40%),hsl(calc(var(--h) + 50) 60% 14%));color:#fff;text-align:center;padding:20px}
.demo small{font-size:12px;font-weight:500;opacity:.7;margin-top:10px;max-width:270px;line-height:1.5}
.rend{max-width:720px;margin:0 auto;padding:40px 20px 70px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--tx)}
.rend p{font-size:13px;opacity:.7}
.rtop,.rbot{position:absolute;left:10px;right:10px;max-width:640px;margin:0 auto;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 14px;transition:transform .3s,opacity .3s;color:var(--tx)}
.rtop{top:calc(8px + env(safe-area-inset-top,0px))}
.rbot{bottom:calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-between;font-size:13px;font-weight:700}
.rtop b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}.rtop small{font-size:11px;opacity:.65}
.rb{font-size:30px;line-height:1;padding:0 6px;cursor:pointer}
#rd.hb .rtop{transform:translateY(-130%);opacity:0}
#rd.hb .rbot{transform:translateY(130%);opacity:0}
.rprog{position:absolute;top:0;left:0;height:3px;width:0;background:var(--ac);z-index:3}
.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);z-index:20;padding:10px 18px;font-size:13px;font-weight:600;transition:transform .35s;border-radius:99px}
.toast.show{transform:translate(-50%,0)}
footer{text-align:center;font-size:11px;opacity:.45;margin:20px 0}
</style>
</head>
